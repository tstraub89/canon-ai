name: CI

on:
  push:
    branches: [main, dev]
    # `paths-ignore` doesn't support re-includes, so we use `paths` with
    # negative globs to opt out of doc / task paths AND a final positive
    # entry to re-include `tasks/_templates/**` — template changes affect
    # generated artifacts and ARE covered by the test suite, so CI must
    # run for them. Caught via CodeRabbit P2 on PR #45.
    paths:
      - '**'
      - '!AGENTS.md'
      - '!CLAUDE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '!docs/**'
      - 'docs/pipeline-orchestrator.md'
      - '!tasks/**'
      - 'tasks/_templates/**'
      - '!.agent/**'
      - '!.github/**/*.md'
  pull_request:
    # No `branches:` filter — CI is cheap for canon and we want coverage on
    # PRs against every base (main, release/**, future-named integration
    # branches). Path filters still apply so doc-only PRs skip CI.
    paths:
      - '**'
      - '!AGENTS.md'
      - '!CLAUDE.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '!docs/**'
      - 'docs/pipeline-orchestrator.md'
      - '!tasks/**'
      - 'tasks/_templates/**'
      - '!.agent/**'
      - '!.github/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run type-check
      - run: npm run sync-templates:check
      - run: npm run docs-refs-check
      - run: npm run build
      - run: npm test
      - name: Verify committed dist/ matches a fresh build
        # We commit dist/ because `npm install -g <git-url>` cannot reliably
        # rebuild at install time (see npm/cli#8440). This step rebuilds and
        # fails if the committed dist/ is stale — catches "forgot to rebuild
        # dist/ before committing src/ changes."
        run: |
          npm run build
          git diff --exit-code -- dist/ \
            || { echo "::error::dist/ is out of date — run 'npm run build' and commit the result"; exit 1; }
      - name: Verify git-install path produces a working canon binary
        # The real adopter motion: `npm install -g git+file://<src>` in a
        # clean tmpdir, exercising the full git-clone + global-install
        # lifecycle end-to-end. Fails CI if the resulting `canon` binary
        # is broken (e.g., dist/ missing from the tarball, bin path wrong).
        run: |
          cd "$(mktemp -d)"
          git init
          git config user.email "ci@example.com"
          git config user.name "CI"
          git commit --allow-empty -m init
          # `--install-links` packs+installs instead of symlinking the global
          # install to the git cache. Without it, the `canon` bin symlink ends
          # up pointing at a transient cache dir and command-not-found's even
          # though `npm install -g` reports success. (Codex noted this during
          # the implement-phase smoke runs.)
          npm install -g --install-links "git+file://$GITHUB_WORKSPACE"
          canon --version
          node "$(npm root -g)/canon-ai/dist/scripts/run-task.js" --help
          SHIM_DIR="$(mktemp -d)"
          ln -s "$(command -v node)" "$SHIM_DIR/node"
          ln -s "$(command -v npm)" "$SHIM_DIR/npm"
          ln -s "$(command -v git)" "$SHIM_DIR/git"
          ln -s "$(command -v canon)" "$SHIM_DIR/canon"
          ln -s "$(command -v which)" "$SHIM_DIR/which"
          printf '#!/bin/sh\necho claude-shim\n' > "$SHIM_DIR/claude"
          printf '#!/bin/sh\necho codex-shim\n' > "$SHIM_DIR/codex"
          chmod +x "$SHIM_DIR/claude" "$SHIM_DIR/codex"
          if PATH="$SHIM_DIR" command -v jq; then
            echo "::error::jq unexpectedly present in jq-less smoke PATH"
            exit 1
          fi
          PATH="$SHIM_DIR" canon init
          test -f AGENTS.md
          test -f CLAUDE.md
          test -d .canon/templates
          test -d .claude/skills
          PATH="$SHIM_DIR" canon doctor
          PATH="$SHIM_DIR" canon task new test-task "Test"
          test -f tasks/test-task/status.json
          node -e "JSON.parse(require('fs').readFileSync('tasks/test-task/status.json','utf8'))"
