name: Auto-release

# Fires on push to main. If no GitHub release for package.json's version
# exists yet, create the v<X.Y.Z> tag and a release using the matching block
# from CHANGELOG.md as the body. Idempotent: re-runs once the release exists
# exit silently. A prior run that created the tag but failed before
# publishing the release can self-heal on the next push, because the skip
# check looks for the release object — not just the tag.
#
# Operational doc: docs/release-process.md.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v6
        with:
          # Full history is needed so `git blame` can identify the commit
          # that last set the current package.json version — that's the
          # release commit we want to tag and target, not the SHA of
          # whatever push triggered this workflow run.
          fetch-depth: 0

      - name: Set up Node (for lockfile regen check)
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Verify lockfile integrity
        run: |
          set -euo pipefail
          # Defense-in-depth gate for releases. The CI workflow runs the
          # same kind of check on every PR, but this guard ensures the
          # release workflow never publishes a release from a tree with a
          # stale or corrupted package-lock.json. Regenerate the lockfile
          # cleanly from package.json; if any byte changes vs the checked-in
          # file, fail. Catches both stale lockfiles and the
          # transitive-version-rewrite bug from the 1.1.3 picocolors
          # incident (where a literal sed substitution rewrote the
          # picocolors lockfile entry's version field). `npm install`
          # regenerates that field from the registry, restoring the
          # correct value — so `git diff` will catch the corruption.
          npm install --package-lock-only --silent
          if ! git diff --quiet -- package-lock.json; then
            echo "::error::package-lock.json is stale or corrupted — regenerate with 'npm install --package-lock-only' and commit"
            git --no-pager diff -- package-lock.json | head -80 || true
            exit 1
          fi

      - name: Identify the version-bump commit
        id: bump
        run: |
          set -euo pipefail
          # Blame the package.json line that holds the root version. The
          # commit returned is the one that last set the field to the
          # current value — i.e., the release commit. We tag/target that
          # SHA so a self-heal retry on a later push still points the
          # release at the actual release commit, not at $GITHUB_SHA.
          # The CHANGELOG block is also extracted from this SHA's tree
          # (Extract step below) so tag content and release notes are
          # guaranteed to describe the same commit — issues #87/#88
          # surfaced when CHANGELOG was read from HEAD while the tag
          # pointed at the blame-derived bump SHA.
          LINE="$(grep -n '"version"' package.json | head -1 | cut -d: -f1)"
          if [ -z "$LINE" ]; then
            echo "::error::could not locate \"version\" field in package.json"
            exit 1
          fi
          SHA="$(git blame -L "$LINE,$LINE" --porcelain -- package.json | awk 'NR==1 { print $1; exit }')"
          if [ -z "$SHA" ] || [ "$SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::git blame could not identify the version-bump commit"
            exit 1
          fi
          echo "Version-bump commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Read versions and compare
        id: versions
        run: |
          set -euo pipefail
          # Read both files from the blame-derived bump SHA's tree, not the
          # workflow's working checkout. Checking HEAD here is insufficient:
          # if the .canon/version bump lands in a follow-up commit instead
          # of atomically with the package.json bump (both in the same
          # push), HEAD shows the two files agreeing even though the SHA
          # that will actually be tagged (the bump SHA, picked by blame) is
          # internally inconsistent. The v2.1.0 release shipped exactly
          # this way: tagged at the package.json-bump commit while
          # .canon/version there still read the prior version, one commit
          # before the file was corrected.
          BUMP_SHA="${{ steps.bump.outputs.sha }}"
          PKG_VERSION="$(git show "${BUMP_SHA}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          if ! git cat-file -e "${BUMP_SHA}:.canon/version" 2>/dev/null; then
            echo "::error::.canon/version missing at bump commit ${BUMP_SHA} — release blocked"
            exit 1
          fi
          CANON_VERSION="$(git show "${BUMP_SHA}:.canon/version" | tr -d ' \n\r')"
          if [ "$PKG_VERSION" != "$CANON_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match .canon/version ($CANON_VERSION) at bump commit ${BUMP_SHA} — release blocked"
            exit 1
          fi
          if ! printf '%s' "$PKG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version '$PKG_VERSION' is not semver — release blocked"
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$PKG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip if GitHub release already exists
        id: release-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.versions.outputs.tag }}"
          # Gate on the release object, not just the tag. A prior run that
          # created the tag but failed before publishing the release must
          # still be able to self-heal on retry. `gh release create` reuses
          # an existing tag (won't try to recreate it), so the create step
          # below is safe to re-run when the tag already exists but the
          # release doesn't.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract matching CHANGELOG block
        if: steps.release-check.outputs.skip != 'true'
        id: changelog
        run: |
          set -euo pipefail
          VERSION="${{ steps.versions.outputs.version }}"
          BUMP_SHA="${{ steps.bump.outputs.sha }}"
          # Read CHANGELOG.md from the EXACT tree we're about to tag, not
          # from the workflow's working checkout. The two are normally the
          # same SHA, but with the blame-based bump-SHA approach (pre-1.3.1)
          # they could diverge and the release would publish notes for a
          # different commit than the tag pointed at. Reading from the tag's
          # tree makes that mismatch impossible by construction (issues
          # #87, #88, #92).
          if ! git cat-file -e "${BUMP_SHA}":CHANGELOG.md 2>/dev/null; then
            echo "::error::CHANGELOG.md not found in tree at ${BUMP_SHA}"
            exit 1
          fi
          git show "${BUMP_SHA}":CHANGELOG.md > /tmp/tagged-changelog.md

          # Capture the header line for the version (with its date) so we can
          # validate the date isn't a placeholder.
          HEADER="$(awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { print; exit }
          ' /tmp/tagged-changelog.md)"
          if [ -z "$HEADER" ]; then
            echo "::error::CHANGELOG.md at ${BUMP_SHA} has no '## [$VERSION]' block — add an entry before releasing"
            exit 1
          fi
          # Reject the "unreleased" placeholder — release-process.md requires
          # a real date before the release PR opens.
          if printf '%s' "$HEADER" | grep -qi 'unreleased'; then
            echo "::error::CHANGELOG block for $VERSION still says 'unreleased' — replace with the real release date"
            exit 1
          fi
          # Extract the body (everything between this header and the next "## ["
          # heading, exclusive on both ends), and trim leading/trailing blank
          # lines so the published notes don't start or end with a gap.
          awk -v v="$VERSION" '
            BEGIN { in_block = 0; first = 0; last = 0; n = 0 }
            /^## \[/ {
              if (in_block) { in_block = 0 }
              else if ($0 ~ ("^## \\[" v "\\]")) { in_block = 1; next }
            }
            in_block {
              n++; data[n] = $0
              if ($0 ~ /[^[:space:]]/) {
                if (!first) first = n
                last = n
              }
            }
            END {
              if (first) for (i = first; i <= last; i++) print data[i]
            }
          ' /tmp/tagged-changelog.md > /tmp/release-notes.md
          if ! [ -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG block for $VERSION is empty — add release notes before releasing"
            exit 1
          fi
          {
            echo "header<<EOF"
            echo "$HEADER"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        if: steps.release-check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.versions.outputs.tag }}"
          VERSION="${{ steps.versions.outputs.version }}"
          BUMP_SHA="${{ steps.bump.outputs.sha }}"
          gh release create "$TAG" \
            --target "$BUMP_SHA" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md
          echo "Released $TAG at $BUMP_SHA"

      - name: Verify tag tree matches release notes
        if: steps.release-check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # Re-fetch the just-published tag and assert its CHANGELOG block
          # for $VERSION is byte-identical to the release-notes file we
          # uploaded. The "Extract" step above already reads from the bump
          # SHA so the two SHOULD match by construction — this step catches
          # any future regression that decouples them (issue #92). A
          # header-only assertion would miss the exact tree/notes mismatch
          # this step exists to prevent, so we extract the full block from
          # the tag and diff it against /tmp/release-notes.md.
          TAG="${{ steps.versions.outputs.tag }}"
          VERSION="${{ steps.versions.outputs.version }}"
          git fetch --tags origin
          # Re-run the same extraction (trim leading/trailing blanks) against
          # the tag's CHANGELOG.md so the comparison is apples-to-apples
          # with what got uploaded.
          git show "${TAG}":CHANGELOG.md > /tmp/tagged-changelog-verify.md
          awk -v v="$VERSION" '
            BEGIN { in_block = 0; first = 0; last = 0; n = 0 }
            /^## \[/ {
              if (in_block) { in_block = 0 }
              else if ($0 ~ ("^## \\[" v "\\]")) { in_block = 1; next }
            }
            in_block {
              n++; data[n] = $0
              if ($0 ~ /[^[:space:]]/) {
                if (!first) first = n
                last = n
              }
            }
            END {
              if (first) for (i = first; i <= last; i++) print data[i]
            }
          ' /tmp/tagged-changelog-verify.md > /tmp/tagged-block.md
          if ! [ -s /tmp/tagged-block.md ]; then
            echo "::error::Published tag ${TAG} does not contain a '## [${VERSION}]' CHANGELOG block — release notes and tag content are out of sync"
            exit 1
          fi
          if ! diff -u /tmp/release-notes.md /tmp/tagged-block.md; then
            echo "::error::Published release notes for ${TAG} do not match the CHANGELOG block at the tag. Above diff is (published notes) vs (tag's CHANGELOG block)."
            exit 1
          fi
          echo "Verified: ${TAG}:CHANGELOG.md block for ${VERSION} is byte-identical to published release notes."
