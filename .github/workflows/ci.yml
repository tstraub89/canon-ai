name: CI

on:
  push:
    branches: [main, dev]
    # `paths-ignore` doesn't support re-includes, so we use `paths` with
    # negative globs to opt out of doc / task paths AND a final positive
    # entry to re-include `tasks/_templates/**` — template changes affect
    # generated artifacts and ARE covered by the test suite, so CI must
    # run for them. Caught via CodeRabbit P2 on PR #45.
    paths:
      - '**'
      - '!AGENTS.md'
      - '!CLAUDE.md'
      - '!CODEX.md'
      - '!docs/**'
      - '!tasks/**'
      - 'tasks/_templates/**'
      - '!.agent/**'
      - '!.github/**/*.md'
  pull_request:
    branches: [main, dev]
    paths:
      - '**'
      - '!AGENTS.md'
      - '!CLAUDE.md'
      - '!CODEX.md'
      - '!docs/**'
      - '!tasks/**'
      - 'tasks/_templates/**'
      - '!.agent/**'
      - '!.github/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
