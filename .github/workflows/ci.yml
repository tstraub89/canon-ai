name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODEX.md'
      - 'docs/**'
      - 'tasks/**'
      - 'scripts/task.sh'
      - '.agent/**'
      - '.github/**/*.md'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CODEX.md'
      - 'docs/**'
      - 'tasks/**'
      - 'scripts/task.sh'
      - '.agent/**'
      - '.github/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['24.x']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
